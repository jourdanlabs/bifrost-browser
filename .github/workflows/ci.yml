name: BIFROST Browser CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open-source preflight
        run: Scripts/oss-preflight.sh
      - name: Native acceptance
        run: Scripts/acceptance.sh
